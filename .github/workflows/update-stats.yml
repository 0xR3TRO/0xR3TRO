name: Update Profile Telemetry

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate profile SVG assets
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: python3 scripts/generate_assets.py

      - name: Commit updated SVG assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --cached --quiet; then
            echo "No telemetry changes to commit."
            exit 0
          fi
          git commit -m "chore(telemetry): refresh profile SVG metrics"
          git push
