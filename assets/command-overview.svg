      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="65%" stop-color="#34d399" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0b0f14" stop-opacity="0"/>
